<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF3EE"/>
      <stop offset="1" stop-color="#F6E3DA"/>
    </linearGradient>
    <linearGradient id="heartFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D06B7C"/>
      <stop offset="1" stop-color="#A6425A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- back heart, gold, offset up-left, scaled to fill most of the canvas -->
  <path transform="translate(-116.4,-96.4) scale(1.4)"
    d="M256 372
       C 168 308, 96 250, 96 178
       C 96 132, 132 100, 174 100
       C 202 100, 232 116, 256 150
       C 280 116, 310 100, 338 100
       C 380 100, 416 132, 416 178
       C 416 250, 344 308, 256 372 Z"
    fill="#D9A05B" opacity="0.6"/>

  <!-- front heart, accent rose, offset down-right -->
  <path transform="translate(-88.4,-68.4) scale(1.4)"
    d="M256 372
       C 168 308, 96 250, 96 178
       C 96 132, 132 100, 174 100
       C 202 100, 232 116, 256 150
       C 280 116, 310 100, 338 100
       C 380 100, 416 132, 416 178
       C 416 250, 344 308, 256 372 Z"
    fill="url(#heartFront)"/>
</svg>
